version: '3.8'

services:
  db:
    container_name: roxiler_mysql_db
    image: mysql:8.0
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Added healthcheck so Docker knows when MySQL is fully ready to accept connections
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: roxiler_backend
    build: ./backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      PORT: 5000
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PORT: 3306
    # Wait until the database is fully healthy before starting the backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: roxiler_frontend
    build: ./frontend
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  db_data: